<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#0f766e">
<title>Alquileres PY</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:#f4f6f5;color:#1a2321;padding-bottom:70px}
header{background:#0f766e;color:#fff;padding:14px 16px;font-weight:700;font-size:18px}
#app{padding:14px;max-width:640px;margin:auto}
h2{margin:6px 0 12px}label{display:block;font-size:13px;font-weight:600;margin:10px 0 4px}
input,select,textarea{width:100%;padding:12px;border:1px solid #cfd8d5;border-radius:10px;font-size:16px;background:#fff}
textarea{min-height:90px}
button{border:0;border-radius:10px;padding:13px;font-size:16px;font-weight:700;cursor:pointer;background:#0f766e;color:#fff;width:100%;margin-top:12px}
button:disabled{background:#9db5b1}button.s{background:#e3ece9;color:#0f766e}button.r{background:#b91c1c}button.w{background:#16a34a}
.card{background:#fff;border-radius:14px;overflow:hidden;margin-bottom:14px;box-shadow:0 1px 4px #0002}
.card img{width:100%;height:190px;object-fit:cover;display:block;background:#dde}
.in{padding:12px}.pr{font-size:20px;font-weight:800;color:#0f766e}.m{color:#5b6b67;font-size:14px}
.gal{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;gap:6px;border-radius:12px}
.gal img{width:100%;flex:0 0 100%;height:260px;object-fit:cover;scroll-snap-align:center}
.th{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.th img{width:64px;height:64px;object-fit:cover;border-radius:8px}
.tag{display:inline-block;padding:3px 10px;border-radius:99px;font-size:12px;font-weight:700}
.pending{background:#fef3c7;color:#92400e}.approved{background:#d1fae5;color:#065f46}.rejected{background:#fee2e2;color:#991b1b}
.c{text-align:center;color:#5b6b67;padding:20px}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #dde}
nav button{background:none;color:#5b6b67;margin:0;border-radius:0;font-size:12px;padding:12px 2px}
#t{position:fixed;top:60px;left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:10px 16px;border-radius:10px;display:none;z-index:9;max-width:90%}
.ck{display:flex;gap:8px;align-items:flex-start;margin-top:12px;font-size:14px}.ck input{width:auto;margin-top:3px}
</style></head><body>
<header>🏠 Alquileres PY</header><div id="t"></div><div id="app"></div><nav id="navbar"></nav>
<script>
const sb=supabase.createClient('https://luuvyaliasfqoxufraoq.supabase.co','sb_publishable__znIzjW5Hlz626OaVDPMCw_qicDr6Cj');
const app=document.getElementById('app');
let user=null,admin=false,files=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const gs=n=>'Gs. '+Number(n).toLocaleString('es-PY');
const DEPTS=['Capital','Central','Alto Paraná','Itapúa','Concepción','San Pedro','Cordillera','Guairá','Caaguazú','Caazapá','Misiones','Paraguarí','Amambay','Canindeyú','Presidente Hayes','Boquerón','Alto Paraguay','Ñeembucú'];
const TYPES=['Casa','Departamento','Habitación','Dúplex','Local','Otro'];
const ST={pending:'En revisión',approved:'Publicada',rejected:'Rechazada'};
const opts=(a,s)=>a.map(x=>`<option ${x===s?'selected':''}>${x}</option>`).join('');
const imgs=p=>(p.property_images||[]).map(i=>i.image_url).sort();
function toast(m){const t=document.getElementById('t');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
function drawNav(){const b=[['🔍 Buscar','home()'],['➕ Publicar','publish()'],['📋 Mis anuncios','mine()']];
if(admin)b.push(['🛡️ Admin','adminView()']);b.push(['👤 Cuenta','account()']);
document.getElementById('navbar').innerHTML=b.map(x=>`<button onclick="${x[1]}">${x[0]}</button>`).join('')}
function loading(){app.innerHTML='<p class="c">Cargando…</p>'}
function home(){app.innerHTML=`<h2>¿Qué estás buscando?</h2>
<label>Ciudad</label><input id="c" placeholder="Ej: Hohenau">
<label>Tipo</label><select id="t2"><option value="">Todos</option>${opts(TYPES)}</select>
<label>Precio máximo (Gs.)</label><input id="p" type="number" inputmode="numeric" placeholder="2500000">
<button onclick="results()">BUSCAR</button><button class="s" onclick="publish()">PUBLICAR PROPIEDAD</button>`}
async function results(){const c=document.getElementById('c')?.value.trim(),t=document.getElementById('t2')?.value,p=document.getElementById('p')?.value;
loading();let q=sb.from('properties').select('*,property_images(image_url)').eq('status','approved').order('created_at',{ascending:false});
if(c)q=q.ilike('city','%'+c+'%');if(t)q=q.eq('property_type',t);if(p)q=q.lte('price',p);
const{data,error}=await q;if(error)return app.innerHTML='<p class="c">Error: '+esc(error.message)+'</p>';
app.innerHTML=`<h2>Propiedades${c?' en '+esc(c):''}</h2>`+(data.length?data.map(x=>`<div class="card"><img src="${esc(imgs(x)[0]||'')}" loading="lazy"><div class="in"><div class="pr">${gs(x.price)} / mes</div><b>${esc(x.title)}</b><div class="m">${esc(x.city)} · ${x.bedrooms} hab. · ${x.bathrooms} baño(s)</div><button onclick="detail('${x.id}')">VER PROPIEDAD</button></div></div>`).join(''):'<p class="c">No hay propiedades con esos filtros.</p>')+'<button class="s" onclick="home()">← Nueva búsqueda</button>'}
async function detail(id){loading();const{data:x,error}=await sb.from('properties').select('*,property_images(image_url)').eq('id',id).single();
if(error)return app.innerHTML='<p class="c">No se pudo cargar.</p>';
let n=String(x.whatsapp).replace(/\D/g,'');if(n.startsWith('0'))n='595'+n.slice(1);
const msg=encodeURIComponent('Hola, vi tu propiedad publicada en Alquileres PY y quisiera obtener más información.');
app.innerHTML=`<div class="gal">${imgs(x).map(u=>`<img src="${esc(u)}">`).join('')}</div>
<h2>${esc(x.title)}</h2><div class="pr">${gs(x.price)} / mes</div>
<p class="m">📍 ${esc(x.city)}${x.neighborhood?' — '+esc(x.neighborhood):''}, ${esc(x.department)}</p>
<p>🛏 ${x.bedrooms} habitaciones · 🚿 ${x.bathrooms} baño(s) · ${esc(x.property_type)}</p>
<p style="white-space:pre-wrap">${esc(x.description)}</p>
<a href="https://wa.me/${n}?text=${msg}" target="_blank"><button class="w">CONTACTAR POR WHATSAPP</button></a>
<button class="s" onclick="results()">← Volver</button>`}
function account(){if(user){app.innerHTML=`<h2>Mi cuenta</h2><p>${esc(user.email)}</p><button class="s" onclick="sb.auth.signOut()">Cerrar sesión</button>`}else auth()}
function auth(){app.innerHTML=`<h2>Entrar o crear cuenta</h2><label>Correo</label><input id="e" type="email"><label>Contraseña (mín. 6)</label><input id="pw" type="password">
<button onclick="login()">ENTRAR</button><button class="s" onclick="signup()">CREAR CUENTA</button>`}
async function login(){const{error}=await sb.auth.signInWithPassword({email:e.value.trim(),password:pw.value});if(error)toast(error.message)}
async function signup(){const{data,error}=await sb.auth.signUp({email:e.value.trim(),password:pw.value});if(error)return toast(error.message);if(!data.session)toast('Revisa tu correo para confirmar')}
function publish(){if(!user){toast('Primero entra o crea tu cuenta');return auth()}
app.innerHTML=`<h2>Publicar propiedad</h2>
<label>Título</label><input id="ti" maxlength="80" placeholder="Casa en alquiler">
<label>Precio mensual (Gs.)</label><input id="pr" type="number" inputmode="numeric">
<label>Departamento</label><select id="de">${opts(DEPTS,'Itapúa')}</select>
<label>Ciudad</label><input id="ci"><label>Barrio</label><input id="ba">
<label>Tipo</label><select id="ty">${opts(TYPES)}</select>
<label>Dormitorios</label><input id="be" type="number" inputmode="numeric" min="0">
<label>Baños</label><input id="bt" type="number" inputmode="numeric" min="0">
<label>Descripción</label><textarea id="ds"></textarea>
<label>WhatsApp (ej: 0981123456)</label><input id="wa" inputmode="tel">
<label>Fotografías — 5 mínimo, 15 máximo</label><input id="ph" type="file" accept="image/*" multiple>
<div id="cnt" class="m"></div><div id="thm" class="th"></div>
<div class="ck"><input type="checkbox" id="ok"><span>Confirmo que el precio publicado es el precio real que solicito por el alquiler.</span></div>
<button id="go" disabled onclick="send()">ENVIAR A REVISIÓN</button>
<p class="m">Tu anuncio será revisado antes de publicarse.</p>`;
files=[];app.querySelectorAll('input,select,textarea').forEach(i=>i.oninput=check);
ph.onchange=()=>{files=files.concat([...ph.files]).slice(0,15);ph.value='';check();
thm.innerHTML='';files.forEach(f=>{const i=new Image();i.src=URL.createObjectURL(f);thm.appendChild(i)})}}
function waNum(v){let n=v.replace(/\D/g,'');if(n.startsWith('0'))n='595'+n.slice(1);return n}
function check(){const n=waNum(wa.value),okw=/^595\d{9}$/.test(n);cnt.textContent=files.length+'/15 fotos (mínimo 5)';
go.disabled=!(files.length>=5&&ti.value.trim()&&+pr.value>0&&ci.value.trim()&&de.value&&ty.value&&be.value!==''&&bt.value!==''&&ds.value.trim().length>=10&&okw&&ok.checked)}
function compress(f){return new Promise((res,rej)=>{const i=new Image();i.onload=async()=>{const s=Math.min(1,1280/Math.max(i.width,i.height)),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);
let q=.8,b;do{b=await new Promise(r=>c.toBlob(r,'image/jpeg',q));q-=.1}while(b.size>1000000&&q>.2);res(b)};i.onerror=rej;i.src=URL.createObjectURL(f)})}
async function send(){go.disabled=true;go.textContent='Enviando…';
const{data:p,error}=await sb.from('properties').insert({user_id:user.id,title:ti.value.trim(),price:+pr.value,department:de.value,city:ci.value.trim(),neighborhood:ba.value.trim()||null,property_type:ty.value,bedrooms:+be.value,bathrooms:+bt.value,description:ds.value.trim(),whatsapp:waNum(wa.value),status:'pending'}).select().single();
if(error){toast(error.message);go.textContent='ENVIAR A REVISIÓN';return check()}
try{for(let i=0;i<files.length;i++){const b=await compress(files[i]),path=`${user.id}/${p.id}/${i}.jpg`;
const u=await sb.storage.from('property-photos').upload(path,b,{contentType:'image/jpeg'});if(u.error)throw u.error;
const url=sb.storage.from('property-photos').getPublicUrl(path).data.publicUrl;
const r=await sb.from('property_images').insert({property_id:p.id,image_url:url});if(r.error)throw r.error}
toast('¡Enviado a revisión!');mine()}catch(err){toast('Error subiendo fotos: '+err.message);go.textContent='ENVIAR A REVISIÓN'}}
async function mine(){if(!user){toast('Primero entra');return auth()}loading();
const{data,error}=await sb.from('properties').select('*,property_images(image_url)').eq('user_id',user.id).order('created_at',{ascending:false});
if(error)return app.innerHTML='<p class="c">'+esc(error.message)+'</p>';
app.innerHTML='<h2>Mis anuncios</h2>'+(data.length?data.map(x=>`<div class="card"><div class="in"><b>${esc(x.title)}</b><div class="m">${esc(x.city)} · ${gs(x.price)} · ${imgs(x).length} fotos</div><span class="tag ${x.status}">${ST[x.status]}</span></div></div>`).join(''):'<p class="c">Aún no publicaste nada.</p>')}
async function adminView(){loading();
const{data,error}=await sb.from('properties').select('*,property_images(image_url)').eq('status','pending').order('created_at');
if(error)return app.innerHTML='<p class="c">'+esc(error.message)+'</p>';
app.innerHTML=`<h2>Pendientes: ${data.length}</h2>`+data.map(x=>`<div class="card"><div class="in"><b>${esc(x.title)}</b><div class="pr">${gs(x.price)}</div>
<div class="m">${esc(x.city)}, ${esc(x.department)} · ${esc(x.neighborhood||'')} · ${esc(x.property_type)} · ${x.bedrooms} hab · ${x.bathrooms} baños<br>WhatsApp: ${esc(x.whatsapp)} · ${imgs(x).length} fotos</div>
<p style="white-space:pre-wrap">${esc(x.description)}</p><div class="th">${imgs(x).map(u=>`<a href="${esc(u)}" target="_blank"><img src="${esc(u)}"></a>`).join('')}</div>
<button onclick="setSt('${x.id}','approved')">APROBAR</button><button class="r" onclick="setSt('${x.id}','rejected')">RECHAZAR</button></div></div>`).join('')}
async function setSt(id,s){const{error}=await sb.from('properties').update({status:s}).eq('id',id);if(error)toast(error.message);else{toast(s==='approved'?'Aprobada':'Rechazada');adminView()}}
async function setUser(u){user=u;admin=false;if(u){const r=await sb.rpc('is_admin');admin=r.data===true}drawNav()}
sb.auth.onAuthStateChange((ev,s)=>{setTimeout(async()=>{await setUser(s?.user||null);if(ev==='SIGNED_IN'||ev==='SIGNED_OUT')home()},0)});
sb.auth.getSession().then(async({data})=>{await setUser(data.session?.user||null);home()});
</script></body></html>
