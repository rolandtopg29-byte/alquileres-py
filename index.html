<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Alquileres PY</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script><style>*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui, -apple-system, sans-serif}body{background:#f6f7f9;padding-bottom:90px}header{background:#fff;padding:14px 16px;position:sticky;top:0;z-index:10;border-bottom:1px solid #e5e7eb;display:flex;justify-content:space-between;align-items:center}header h1{font-size:18px}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #e5e7eb;display:flex;z-index:10}nav button{flex:1;padding:14px 4px;border:0;background:#fff;font-size:11px;font-weight:600}nav button.active{font-weight:800;color:#000;border-top:3px solid #000}.card{background:#fff;border-radius:14px;overflow:hidden;border:1px solid #e5e7eb;margin:12px}.card img{width:100%;height:190px;object-fit:cover;background:#eee}.card-body{padding:12px}.price{font-weight:800;font-size:16px}input,select,textarea{width:100%;padding:12px;border:1px solid #d1d5db;border-radius:10px;margin-top:6px;font-size:15px;background:#fff}label{font-size:13px;font-weight:700;margin-top:14px;display:block}.btn{width:100%;padding:14px;border:0;border-radius:12px;font-weight:700;margin-top:12px;font-size:15px;cursor:pointer}.btn-primary{background:#111;color:#fff}.section{padding:16px;max-width:600px;margin:0 auto}.hidden{display:none!important}</style></head><body>
<header><h1>🏠 Alquileres PY</h1><div><button id="btnLogin" onclick="showPage('auth')" style="border:1px solid #ddd;background:#fff;padding:6px 12px;border-radius:8px">Entrar</button><button id="btnLogout" class="hidden" onclick="logout()" style="border:1px solid #ddd;background:#fff;padding:6px 12px;border-radius:8px">Salir</button></div></header>
<div id="page-home" class="section"><h2 style="margin-bottom:12px">¿Qué estás buscando?</h2><label>Ciudad</label><input id="searchCity" placeholder="Ej: Hohenau"><label>Precio máximo (Gs.)</label><input id="searchPrice" type="number" placeholder="2500000"><button class="btn btn-primary" onclick="doSearch()">BUSCAR</button><div id="homeResults" style="margin-top:16px"></div></div>
<div id="page-results" class="section hidden"><button onclick="showPage('home')" style="background:none;border:0;font-weight:700;margin-bottom:10px">← Volver</button><h3 id="resultsTitle"></h3><div id="resultsList"></div></div>
<div id="page-detail" class="section hidden"><button onclick="showPage('home')" style="background:none;border:0;font-weight:700;margin-bottom:10px">← Volver</button><div id="detailContent"></div></div>
<div id="page-publish" class="section hidden"><h2>Publicar Propiedad</h2><label>Título *</label><input id="p-title" placeholder="Casa 3 dorm en Obligado"><label>Fotos (5 a 15) *</label><input id="p-photos" type="file" accept="image/*" multiple><div id="photoCount" style="font-size:12px;margin-top:4px;color:#666"></div><label>Precio Gs *</label><input id="p-price" type="number"><label>Departamento *</label><select id="p-dept"></select><label>Ciudad *</label><input id="p-city" placeholder="Obligado"><label>Barrio</label><input id="p-barrio"><label>Tipo *</label><select id="p-type"><option value="">Seleccionar</option><option>Casa</option><option>Departamento</option><option>Habitación</option><option>Dúplex</option><option>Galpón</option><option>Terreno</option><option>Local comercial</option></select><div style="display:grid;grid-template-columns:1fr 1fr;gap:10px"><div><label>Habitaciones</label><input id="p-beds" type="number" value="1"></div><div><label>Baños</label><input id="p-baths" type="number" value="1"></div></div><label>Descripción *</label><textarea id="p-desc" rows="4"></textarea><label>WhatsApp *</label><input id="p-wa" placeholder="+595981..."><label style="font-weight:400;display:flex;gap:8px;align-items:center;margin-top:16px"><input id="p-confirm" type="checkbox" style="width:auto"> Confirmo que el precio es real</label><div id="pubMsg" style="margin-top:10px;font-size:13px"></div><button class="btn btn-primary" onclick="publish()">ENVIAR A REVISIÓN</button></div>
<div id="page-mine" class="section hidden"><h2>Mis publicaciones</h2><div id="mineList"></div></div>
<div id="page-admin" class="section hidden"><h2>Admin - Pendientes</h2><div id="adminList"></div></div>
<div id="page-auth" class="section hidden"><h2>Entrar</h2><label>Email</label><input id="a-email"><label>Contraseña</label><input id="a-pass" type="password"><button class="btn btn-primary" onclick="login()">Entrar</button><button class="btn" onclick="signup()" style="background:#eee">Crear cuenta</button><div id="authMsg" style="margin-top:10px;font-size:13px"></div></div>
<nav><button id="nav-home" class="active" onclick="showPage('home')">🔍 Buscar</button><button id="nav-publish" onclick="showPage('publish')">＋ Publicar</button><button id="nav-mine" onclick="showPage('mine')">📋 Mías</button><button id="nav-admin" onclick="showPage('admin')">⚙️ Admin</button></nav>
<script>
const SUPABASE_URL = "https://luuvyaliasfqoxufraoq.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable__znIzjW5Hlz626OaVDPMCw_qicDr6Cj";
const supa = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser=null,isAdmin=false,selectedFiles=[];
const DEPTS=["Itapúa","Alto Paraná","Central","Asunción","Caaguazú","Misiones","Guairá","Paraguarí","Cordillera","San Pedro","Canindeyú","Amambay","Concepción","Ñeembucú","Presidente Hayes","Boquerón","Alto Paraguay","Caazapá"];
function init(){document.getElementById('p-dept').innerHTML='<option value="">Seleccionar</option>'+DEPTS.map(d=>`<option>${d}</option>`).join('');}
init();
document.getElementById('p-photos').addEventListener('change',e=>{selectedFiles=Array.from(e.target.files).slice(0,15);document.getElementById('photoCount').textContent=selectedFiles.length+' fotos seleccionadas';});
async function checkAuth(){const {data}=await supa.auth.getSession();currentUser=data.session?.user||null;document.getElementById('btnLogin').classList.toggle('hidden',!!currentUser);document.getElementById('btnLogout').classList.toggle('hidden',!currentUser);if(currentUser){const {data:r}=await supa.from('admins').select('user_id').eq('user_id',currentUser.id).maybeSingle();isAdmin=!!r;}document.getElementById('nav-admin').style.display=isAdmin?'':'none';}
checkAuth();
function showPage(n){document.querySelectorAll('[id^="page-"]').forEach(e=>e.classList.add('hidden'));document.querySelectorAll('nav button').forEach(b=>b.classList.remove('active'));document.getElementById('page-'+n).classList.remove('hidden');document.getElementById('nav-'+n)?.classList.add('active');if(n==='mine')loadMine();if(n==='admin')loadAdmin();if(n==='home')loadHome();}
async function loadHome(){const {data}=await supa.from('properties').select('id,title,price,city,property_images(image_url)').eq('status','approved').order('created_at',{ascending:false}).limit(20);const c=document.getElementById('homeResults');if(!data||!data.length){c.innerHTML='<p style="color:#666;margin-top:20px">Aún no hay propiedades aprobadas</p>';return;}c.innerHTML=data.map(p=>`<div class="card" onclick="openDetail('${p.id}')"><img src="${p.property_images?.[0]?.image_url||''}"><div class="card-body"><div class="price">Gs ${Number(p.price).toLocaleString()}</div><div>${p.title}</div><div style="color:#666;font-size:13px">${p.city}</div></div></div>`).join('');}
async function doSearch(){const city=document.getElementById('searchCity').value.trim();const max=document.getElementById('searchPrice').value;let q=supa.from('properties').select('id,title,price,city,property_images(image_url)').eq('status','approved');if(city)q=q.ilike('city','%'+city+'%');if(max)q=q.lte('price',Number(max));const {data}=await q.limit(20);document.getElementById('resultsTitle').textContent='Resultados';document.getElementById('resultsList').innerHTML=(data||[]).map(p=>`<div class="card" onclick="openDetail('${p.id}')"><img src="${p.property_images?.[0]?.image_url||''}"><div class="card-body"><div class="price">Gs ${Number(p.price).toLocaleString()}</div><div>${p.title}</div><div style="color:#666;font-size:13px">${p.city}</div></div></div>`).join('');if(!data||!data.length)document.getElementById('resultsList').innerHTML='<p style="color:#666">Sin resultados</p>';showPage('results');}
async function openDetail(id){showPage('detail');const {data:p}=await supa.from('properties').select('*,property_images(image_url)').eq('id',id).single();if(!p)return;const cont=document.getElementById('detailContent');cont.innerHTML=`<div style="display:flex;overflow-x:auto;gap:8px;scroll-snap-type:x mandatory">${p.property_images.map(i=>`<img src="${i.image_url}" style="width:90%;height:280px;object-fit:cover;border-radius:12px;scroll-snap-align:start;flex-shrink:0">`).join('')}</div><div style="padding:12px"><div class="price" style="font-size:22px">Gs ${Number(p.price).toLocaleString()}</div><h2 style="margin-top:6px">${p.title}</h2><div style="color:#666">${p.city} - ${p.department||''} - ${p.neighborhood||''}</div><div style="margin-top:8px">🛏️ ${p.bedrooms||0} hab - 🚿 ${p.bathrooms||0} baños - ${p.property_type||''}</div><p style="margin-top:14px;line-height:1.5">${p.description||''}</p><button class="btn btn-primary" style="background:#25D366;margin-top:16px" onclick="window.open('https://wa.me/${(p.whatsapp||'').replace(/[^0-9]/g,'')}?text=${encodeURIComponent('Hola, me interesa: '+p.title)}','_blank')">💬 WhatsApp</button></div>`;}
async function publish(){if(!currentUser){showPage('auth');return;}if(selectedFiles.length<5){alert('Mínimo 5 fotos');return;}const title=document.getElementById('p-title').value.trim(),price=Number(document.getElementById('p-price').value),dept=document.getElementById('p-dept').value,city=document.getElementById('p-city').value.trim(),barrio=document.getElementById('p-barrio').value.trim(),type=document.getElementById('p-type').value,beds=Number(document.getElementById('p-beds').value),baths=Number(document.getElementById('p-baths').value),desc=document.getElementById('p-desc').value.trim(),wa=document.getElementById('p-wa').value.trim(),conf=document.getElementById('p-confirm').checked;if(!title||!price||!dept||!city||!type||!desc||!wa||!conf){alert('Completa todos los campos * y confirma');return;}document.getElementById('pubMsg').textContent='Subiendo... no cierres';try{const {data:prop,[STRIPPED] supa.from('properties').insert({user_id:currentUser.id,title,price,department:dept,city,neighborhood:barrio,property_type:type,bedrooms:beds,bathrooms:baths,description:desc,whatsapp:wa,status:'pending'}).select().single();if(e1)throw e1;for(let i=0;i<selectedFiles.length;i++){const f=selectedFiles[i];const path=`${currentUser.id}/${prop.id}_${Date.now()}_${i}.jpg`;const {error:uE}=await supa.storage.from('property-photos').upload(path,f,{upsert:true});if(uE)throw uE;const {data:pu}=supa.storage.from('property-photos').getPublicUrl(path);await supa.from('property_images').insert({property_id:prop.id,image_url:pu.publicUrl});}document.getElementById('pubMsg').textContent='';alert('Enviado a revisión');showPage('mine');}catch(e){document.getElementById('pubMsg').textContent='Error: '+e.message;alert('Error: '+e.message);}}
async function loadMine(){if(!currentUser){document.getElementById('mineList').innerHTML='<p>Entra primero en Cuenta</p>';return;}const {data}=await supa.from('properties').select('id,title,price,city,status,property_images(image_url)').eq('user_id',currentUser.id).order('created_at',{ascending:false});document.getElementById('mineList').innerHTML=(data||[]).map(p=>`<div class="card"><img src="${p.property_images?.[0]?.image_url||''}"><div class="card-body"><div>${p.title}</div><div>Gs ${Number(p.price).toLocaleString()} - ${p.status}</div></div></div>`).join('')||'<p>Sin publicaciones</p>';}
async function loadAdmin(){if(!isAdmin){document.getElementById('adminList').innerHTML='<div style="background:#fffbe6;padding:12px;border-radius:10px;border:1px solid #facc15">No sos admin.<br>Para hacerte admin, andá a Supabase > SQL Editor y ejecutá:<br><code>insert into admins (user_id) values (\''+(currentUser?.id||'TU_USER_ID')+'\')</code></div>';return;}const {data}=await supa.from('properties').select('*,property_images(image_url)').eq('status','pending').order('created_at',{ascending:false});document.getElementById('adminList').innerHTML=(data||[]).map(p=>`<div class="card"><img src="${p.property_images?.[0]?.image_url||''}" style="width:100%;height:160px;object-fit:cover"><div class="card-body"><div style="font-weight:700">${p.title} - Gs ${Number(p.price).toLocaleString()}</div><div style="color:#666">${p.city} - ${p.whatsapp}</div><p style="margin-top:8px">${(p.description||'').slice(0,200)}</p><div style="display:flex;gap:8px;margin-top:10px"><button class="btn btn-primary" style="flex:1" onclick="setStatus('${p.id}','approved')">Aprobar</button><button class="btn" style="flex:1;background:#fee" onclick="setStatus('${p.id}','rejected')">Rechazar</button></div></div></div>`).join('')||'<p>No hay pendientes</p>';}
async function setStatus(id,s){await supa.from('properties').update({status:s}).eq('id',id);loadAdmin();loadHome();}
async function login(){const e=document.getElementById('a-email').value.trim(),p=document.getElementById('a-pass').value;const {error}=await supa.auth.signInWithPassword({email:e,password:p});if(error){document.getElementById('authMsg').textContent=error.message;return;}await checkAuth();showPage('home');}
async function signup(){const e=document.getElementById('a-email').value.trim(),p=document.getElementById('a-pass').value;const {error}=await supa.auth.signUp({email:e,password:p});if(error){document.getElementById('authMsg').textContent=error.message;return;}document.getElementById('authMsg').textContent='Cuenta creada, revisa tu email';await checkAuth();}
async function logout(){await supa.auth.signOut();currentUser=null;isAdmin=false;checkAuth();showPage('home');}
loadHome();
</script></body></html>
